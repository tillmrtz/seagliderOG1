  long_name: Concentration of phycoerythrin by fluorometer
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PHYC/
  definition: Phycoerythrin concentration per unit volume of fresh or salt water.
PHYCOCYANIN:
  long_name: Concentration of phycocyanin by fluorometer
  definition: Phycocyanin concentration per unit volume of fresh or salt water.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PHYCOCYANIN/
PH_IN_SITU_TOTAL:
  long_name: pH (total scale) of the water body
  definition: pH of the water body measured on the total scale (pH based on concentrations of the free proton and the proton associated with SO4 2-).
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PH_IN_SITU_TOTAL/
PPDOXY:
  long_name: Partial pressure of oxygen in the water body
  definition: The partial pressure of oxygen in air in equilibrium with a water sample.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PPDOXY/
PPOXDOXY:
  long_name: Partial pressure of oxygen
  definition: The pressure that the oxygen component of an atmosphere sample would have if it alone occupied the same volume at the same temperature as the sample.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PPOXDOXY/
RAWDPAR:
  long_name: Raw downwelling photosynthetic available radiation
  definition: The raw output expressed in counts from an upward-facing cosine collector radiometer measuring the integrated light over PAR wavelengths.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RAWDPAR/
RBBP700:
  long_name: Raw signal from backscattering sensor at 700 nanometers
  observation_type: observed
  units: '1'
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RBBP700/
  definition: Raw backscattering sensor signal (count) at 700 nm wavelength. Volume scattering scale factor has not been applied.
REDOX_POTENTIAL_CORR:
  long_name: Redox potential relative to Standard Hydrogen Electrode (SHE)
  definition: A measure of the tendency of the water body to either gain or lose electrons in a reaction. The redox measurement is referenced against a Standard Hydrogen Electrode and can be referred to as Eh.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/REDOX_POTENTIAL_CORR/
RPHDOXY:
  long_name: Uncalibrated red excitation light phase shift reported by oxygen sensor
  definition: Uncalibrated red excitation light phase shift reported by oxygen sensor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RPHDOXY/
RSHEAR_SD:
  long_name: Raw signal (standard deviation) from turbulence profiler shear sensor
  definition: The square root of the average of the squares of deviations about the mean of counts in the water body by a turbulence profiler shear sensor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RSHEAR_SD/
RSHEAR_SD2:
  long_name: Raw signal (standard deviation) from turbulence profiler shear sensor (second sensor)
  definition: The square root of the average of the squares of deviations about the mean of counts in the water body by a second turbulence profiler shear sensor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RSHEAR_SD2/
RTHERTUR_MN:
  long_name: Raw signal (mean) from turbulence profiler thermistor
  definition: The average number of counts in the water body across multiple measurements by a turbulence profiler thermistor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RTHERTUR_MN/
RTHERTUR_MN2:
  long_name: Raw signal (mean) from turbulence profiler thermistor (second sensor)
  definition: The average number of counts in the water body across multiple measurements by a second turbulence profiler thermistor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RTHERTUR_MN2/
RTHERTUR_SD:
  long_name: Raw signal (standard deviation) from turbulence profiler thermistor
  definition: The square root of the average of the squares of deviations about the mean of counts in the water body by a turbulence profiler thermistor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RTHERTUR_SD/
RTHERTUR_SD2:
  long_name: Raw signal (standard deviation) from turbulence profiler thermistor (second sensor)
  definition: The square root of the average of the squares of deviations about the mean of counts in the water body by a second turbulence profiler thermistor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RTHERTUR_SD2/
TCNTDOXY:
  long_name: Count which is expressive of uncalibrated temperature value reported by oxygen sensor
  definition: Count which is expressive of uncalibrated temperature value reported by oxygen sensor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TCNTDOXY/
TCPUCHLA:
  long_name: Thermistor signal from backscattering meter and/or fluorometer
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TCPUCHLA/
  definition: The raw analogue-to-digital converter output from a temperature sensor mounted on a CPU that is a component part of a backscattering meter and/or fluorometer.
TEMPDOXY:
  long_name: Sea temperature from oxygen sensor ITS-90 scale
  definition: Temperature of oxygen determination by optode.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TEMPDOXY/
  units: Celsius
  valid_max: 42
  valid_min: -5
TEMP_FREQ: # Not present in the current NERC OG1 vocabulary.
  long_name: What is this variable?
  units: Hz
  observation_type: observed
TPHDOXY:
  long_name: Uncalibrated (temperature compensated) phase shift reported by oxygen sensor
  definition: Uncalibrated (temperature compensated) phase shift reported by oxygen sensor.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TPHDOXY/
TURB:
  long_name: Turbidity of water in the water body
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TURB/
  definition: Estimate of suspended sediment concentration based on the proportion of a light transmission in the water column that is reflected back to a co-located receiver.
TVLTDOXY:
  long_name: Thermistor voltage reported by oxygen sensor
  definition: Voltage of instrument output by in-situ thermistor
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TVLTDOXY/
VLTDOXY:
  long_name: Voltage reported by oxygen sensor
  definition: The raw output from a dissolved oxygen sensor such as an SBE43 with output as a voltage related to DO concentration.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/VLTDOXY/

################################################################################
# ENGINEERING PARAMETERS
################################################################################

AD2CP_HEADING: # Not present in the current NERC OG1 vocabulary
  long_name: Orientation (horizontal relative to magnetic north) of measurement platform {heading} by compass
  uri: https://vocab.nerc.ac.uk/collection/P02/current/HEADING/
  comment: measured by AD2CP
AD2CP_PITCH: # Not present in the current NERC OG1 vocabulary
  long_name: Orientation (pitch) of measurement platform by inclinometer
  uri: https://vocab.nerc.ac.uk/collection/P02/current/PITCH/
  comment: measured by AD2CP
AD2CP_ROLL: # Not present in the current NERC OG1 vocabulary
  long_name: Orientation (roll angle) of measurement platform by inclinometer
  uri: https://vocab.nerc.ac.uk/collection/P02/current/ROLL/
  comment: measured by AD2CP
ALTITUDE:
  long_name: Height above bed in the water body
  definition: The vertical distance of a platform above the bed surface of a water body.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/ALTITUDE/
COR_FACT:
  long_name: Correlation factor of acoustic signal by altimeter
  definition: Quality of the echo return from an altimeter, ranging from 0 to 1. A value of 1 represents a perfect return echo with negligible noise and distortion.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/COR_FACT/
CPITMPOS:
  long_name: Setting (offset distance from neutral) of glider pitchmass
  definition: The distance of a glider's internal pitch mass from the position that would maintain neutral pitch (Positive nose up).
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/CPITMPOS/
CROLMPOS:
  long_name: Setting (offset angle from neutral) of glider roll mass
  definition: The angle of a glider's internal roll mass from the position that would maintain neutral roll (Positive starboard wing down).
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/CROLMPOS/
CYCLEENG:
  long_name: Engineering data cycle number
  definition: Engineering data cycle number.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/CYCLEENG/
DIST_ALT:
  long_name: Altitude
  definition: Distance in meters from the transducer face to the target.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/DIST_ALT/
ENLEVEL:
  long_name: Energy level of acoustic signal by altimeter
  definition: Intensity of the echo return from an altimeter, ranging from 0 to 1. A value of 1 represents full saturation of the receiver. An energy level of 0.707 (square root of 2) is the theoretical perfect level as it represents the energy of a pure sine wave with an amplitude utilising the maximum dynamic range of the receiver.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/ENLEVEL/
GLCOMPH:
  long_name: Glider command phase
  definition: Glider command phase.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/GLCOMPH/
HEADING:
  long_name: Orientation (horizontal relative to magnetic north) of measurement platform {heading}
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/HEADING/
  definition: The rotation of a platform relative to its upward/Z axis relative to magnetic north. Often referred to as yaw or bearing.
HEADINGTN:
  long_name: Orientation (horizontal relative to True North) of measurement platform {heading}
  definition: The rotation of a platform relative to its upward/Z axis relative to True North. Often referred to as yaw or bearing.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/HEADINGTN/
NBSAMP:
  long_name: Number of samples in bin
  definition: Number of values included in the determination of a statistic such as an average.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/NBSAMP/
PHASE:
  long_name: Identifier of glider phase
  comment: This is based only on splitting each dive cycle into the period before the glider reaches the maximum pressure of that cycle (descent, PHASE=2) and the period after the glider reaches the maximum pressure of that cycle (ascent, PHASE=1)
  phase_vocabulary: https://github.com/OceanGlidersCommunity/OG-format-user-manual/blob/main/vocabularyCollection/phase.md
  units: '1'
  definition: 'Derived from the glider''s engineering state, glider phase reflects the state of glider behaviour. Accepted values range from 0 - 5, with the definitions available at: https://github.com/OceanGlidersCommunity/OG-format-user-manual/blob/main/vocabularyCollection/phase_translation_tables.md.'
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PHASE/
PITCH:
  long_name: Orientation (pitch) of measurement platform by inclinometer
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PITCH/
  definition: The up/down rotation of a platform relative to it Y axis as measured by an inclinometer.
PITMPOS:
  long_name: Setting (counts) of glider pitch mass
  definition: The pitch A/D count position of a glider internal mass.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/PITMPOS/
ROLL:
  long_name: Orientation (roll angle) of measurement platform by inclinometer
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/ROLL/
  definition: The tilting rotation of a platform relative to its longitudinal/X axis as measured by an inclinometer.
ROLMPOS:
  long_name: Setting (counts) of glider roll mass
  definition: The roll A/D count position of a glider internal mass.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/ROLMPOS/
VBD:
  long_name: Setting (counts) of glider variable buoyancy device
  definition: The variable buoyancy device (VBD) A/D count position of a glider.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/VBD/

################################################################################
# FLIGHT VARIABLES AND MODEL PARAMETERS
################################################################################

BUOYANCY: # Not present in the current NERC OG1 vocabulary. Possible OG1 name: RELVBD if this is volume offset from neutral buoyancy.
  long_name: Buoyancy of vehicle, corrected for compression effects
  units: g
DAVG_CURR_EAST: # Not present in the current NERC OG1 vocabulary. Possible OG1 name: WCUR_X, or WATER_VELOC_FINAL_U if surface-drift corrected.
  long_name: depth-averaged current in eastward direction
  standard_name: eastward_sea_water_velocity
  units: m s-1
  observation_type: calculated
  sensor: sensor_ctd, flight_model
  positive: east
DAVG_CURR_EAST_QC: # Not present in the current NERC OG1 vocabulary.
  long_name: depth-averaged current quality control
  standard_name: status_flag
  observation_type: quality flag
  sensor: sensor_ctd, flight_model
DAVG_CURR_NORTH: # Not present in the current NERC OG1 vocabulary. Possible OG1 name: WCUR_Y, or WATER_VELOC_FINAL_V if surface-drift corrected.
  long_name: depth-averaged current in northward direction
  standard_name: northward_sea_water_velocity
  units: m s-1
  observation_type: calculated
  sensor: sensor_ctd, flight_model
  positive: north
DELTA_TIME_S: # Not present in the current NERC OG1 vocabulary.
  long_name: Difference between sample times
  units: seconds
EAST_DISPLACEMENT: # Not present in the current NERC OG1 vocabulary.
  long_name: eastward displacement of platform, from flight model
  sensor: flight_model
  units: m
GLIDER_HORZ_VELO_MODEL: # Not present in the current NERC OG1 vocabulary.
  long_name: glider_horizontal_speed_from_glider_flight_model
  standard_name: horizontal_glider_speed
  units: m s-1
  observation_type: calculated
  sensor: sensor_glider_model
  positive: east
  comment: Vehicle horizontal speed based on hdm
GLIDER_VERT_VELO_MODEL: # Not present in the current NERC OG1 vocabulary.
  long_name: glider vertical speed from glider flight model
  standard_name: vertical_glider_speed
  units: m s-1
  observation_type: calculated
  sensor: sensor_glider_model
  positive: up
GLIDER_VERT_VELO_PRESSURE: # Not present in the current NERC OG1 vocabulary.
  long_name: glider vertical speed from pressure
  standard_name: vertical_glider_speed
  units: m s-1
  observation_type: calculated
  sensor: sensor_ctd
  positive: up
GLIDE_ANGLE: # Not present in the current NERC OG1 vocabulary.
  long_name: glide angle from hydrodynamic model
  units: degrees
  observation_type: calculated
  positive: east
  comment: Glide angle based on hdm
GLIDE_SPEED: # Not present in the current NERC OG1 vocabulary.
  long_name: glider speed from hydrodynamic model
  units: m s-1
  observation_type: calculated
  positive: east
  comment: Vehicle speed based on hdm
NORTH_DISPLACEMENT: # Not present in the current NERC OG1 vocabulary.
  long_name: northward displacement of platform, from flight model
  sensor: flight_model
  units: m
OIL_VOL:
  long_name: Oil volume in the measurement platform
  definition: The volume of oil in the external reservoir of the platform. A positive change in OIL_VOL represents moving oil from the internal reservoir (within the pressure casing) to the external reservoir, increasing the total volume of the platform.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/OIL_VOL/
RELVBD:
  long_name: Setting (volume offset from neutrally buoyant) of glider variable buoyancy device
  definition: The difference between the volume of the internal variable buoyancy device (VBD) on a glider and the volume of the VBD that would maintain neutral buoyancy. If values are positive then the glider rises in the water.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/RELVBD/
  units: cm3
VERT_CURR_MODEL: # Not present in the current NERC OG1 vocabulary.
  long_name: vertical current of seawater derived from glider flight model
  standard_name: vertical_current
  units: m s-1
  observation_type: calculated
  sensor: sensor_ctd
  positive: up
  uri: http://vocab.nerc.ac.uk/collection/P01/current/LRZAZZZZ/
WATER_VELOC_FINAL_U:
  long_name: Eastward current velocity in the water body by dead reckoning and surface drift correction
  definition: The depth-averaged current in the x-axis using dead reckoning between two surfacings. Corrected for surface drift while the glider receives its first GPS fix at the surface.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/WATER_VELOC_FINAL_U/
WATER_VELOC_FINAL_V:
  long_name: Northward current velocity in the water body by dead reckoning and surface drift correction
  definition: The depth-averaged current in the y-axis using dead reckoning between two surfacings. Corrected for surface drift while the glider receives its first GPS fix at the surface.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/WATER_VELOC_FINAL_V/
WCUR_X:
  long_name: Eastward current velocity in the water body
  definition: The depth-averaged current in the x-axis using dead reckoning between two surfacings.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/WCUR_X/
WCUR_Y:
  long_name: Northward current velocity in the water body
  definition: The depth-averaged current in the y-axis using dead reckoning between two surfacings.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/WCUR_Y/

