################################################################################
# COORDINATES AND INDEX VARIABLES
################################################################################

DEPTH:
  source: pressure
  long_name: Depth below sea surface (zero at sea level) of measurement platform
  standard_name: depth
  units: m
  comment: from science pressure and interpolated
  observation_type: calculated
  accuracy: 1
  precision: 2
  resolution: 0.02
  platform: platform
  valid_min: 0
  valid_max: 2000
  reference_datum: surface
  positive: down
  definition: Depth below surface of the water body by unknown instrument and correction to zero at sea level using unspecified algorithm.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/DEPTH/
DEPTH_Z: # Not present in the current NERC OG1 vocabulary.
  source: pressure
  long_name: glider depth
  standard_name: depth
  units: m
  comment: Defined with positive up
  sensor: sensor_ctd
  observation_type: calculated
  platform: platform
  valid_min: -4000
  valid_max: 0
  reference_datum: surface
  positive: up
LAT:
  coordinate_reference_frame: urn:ogc:crs:EPSG::4326
  long_name: Latitude north
  observation_type: measured
  platform: platform
  reference: WGS84
  standard_name: latitude
  units: degrees_north
  valid_max: 90
  valid_min: -90
  axis: Y
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/LAT/
  definition: Latitude north.
LAT_GPS:
  long_name: GPS fixed latitude
  observation_type: measured
  platform: platform
  standard_name: latitude
  units: degrees_north
  valid_max: 90
  valid_min: -90
  axis: Y
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/LAT_GPS/
  definition: Latitude north by unspecified GPS system.
LON:
  coordinate_reference_frame: urn:ogc:crs:EPSG::4326
  long_name: Longitude east
  observation_type: measured
  platform: platform
  reference: WGS84
  standard_name: longitude
  units: degrees_east
  valid_max: 180
  valid_min: -180
  axis: X
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/LON/
  definition: Longitude east.
LON_GPS:
  long_name: GPS fixed longitude
  observation_type: measured
  platform: platform
  standard_name: longitude
  units: degrees_east
  valid_max: 180
  valid_min: -180
  axis: X
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/LON_GPS/
  definition: Longitude east by unspecified GPS system.
TIME:
  long_name: epoch time (glider)
  observation_type: measured
  standard_name: time
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TIME/
  definition: Time elapsed since 1970-01-01T00:00:00Z.
TIMEDF:
  long_name: Time elapsed since since start of day
  definition: Time elapsed since since start of day.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TIMEDF/
TIMEYO:
  long_name: Time elapsed since since start of glider yo
  definition: Time elapsed since since start of glider yo.
  uri: https://vocab.nerc.ac.uk/collection/OG1/current/TIMEYO/
TIME_GPS: # Not present in the current NERC OG1 vocabulary.
  long_name: time of each GPS location
  units: seconds since 1970-01-01T00:00:00Z

