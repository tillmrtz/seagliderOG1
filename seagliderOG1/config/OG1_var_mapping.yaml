sg_cal_vbd_cnts_per_cc: VBD_CNTS_PER_CC  # Not present in NERC OG1.
sg_cal_vbd_min_cnts: VBD_MIN_CNTS  # Not present in NERC OG1.
log_VBD_MIN: VBD_MIN_CNTS  # Not present in NERC OG1.
sg_cal_volmax: VOLMAX  # Not present in NERC OG1.

