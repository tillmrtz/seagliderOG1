#### FLIGHT VARIABLES AND MODEL PARAMETERS (Original -> Requested OG1 Name) ####
buoyancy: BUOYANCY  # Not present in NERC OG1. Possible OG1 name: RELVBD.
depth_avg_curr_east: DAVG_CURR_EAST  # Not present in NERC OG1. Possible OG1 name: WCUR_X or WATER_VELOC_FINAL_U.
