################################################################################
# OG1 VARIABLE MAPPING CONFIGURATION
#
# Purpose: Maps original dataset variable names to OceanGlider 1 (OG1)
# standard variable names.
#
# The original variable names are used here to map to the corresponding OG1
# names. Common source prefixes or suffixes such as "eng_", "<instrument>_",
# or "ctd_" do not have to be specified here.
#
# Sensor identification is not included in this YAML file.
# Official OG1 parameter vocabulary (checked 2026-09-24):
# https://vocab.nerc.ac.uk/collection/OG1/current/
#
# Entries marked "Not present" use the requested target name unchanged even
# though that exact name is absent from the current NERC OG1 vocabulary.
# A possible official OG1 name is noted only where a plausible match exists.
################################################################################

#### COORDINATES AND INDEX VARIABLES (Original -> Requested OG1 Name) ####
ctd_depth: DEPTH
depth: DEPTH
latitude: LAT
gps_lat: LAT_GPS
longitude: LON
gps_lon: LON_GPS
ctd_time: TIME
time: TIME
gps_time: TIME_GPS  # Not present in NERC OG1.
trajectory: TRAJECTORY  # Not present in NERC OG1.

#### HYDROGRAPHIC VARIABLES (Original -> Requested OG1 Name) ####
absolute_salinity: SA  # Not present in NERC OG1.
conductivity: CNDC
conductivity_raw: CNDC_RAW  # Not present in NERC OG1.
conservative_temperature: CT  # Not present in NERC OG1.
ctd_density: DENSITY
density_insitu: DENSITY
potential_density: POTDENS0
gsw_sigma0: POTDENS0
pressure: PRES
ctd_pressure: PRES
salinity: PSAL
salinity_raw: PSAL_RAW  # Not present in NERC OG1.
sigma_t: SIGMA_T
sigma_theta: SIGTHETA
sound_velocity: SOUND_VEL
temperature: TEMP
temp: TEMP
temperature_raw: TEMP_RAW  # Not present in NERC OG1.
potential_temperature: THETA
theta: THETA

#### BIOGEOCHEMICAL VARIABLES (Original -> Requested OG1 Name) ####
blueCount: BBP470
blueRef: BBP470_REF  # Not present in NERC OG1.
bb700: BBP700
backscatter_scaled: BBP700
particulate_backscatter: BBP700
redCount: BBP700
redRef: BBP700_REF  # Not present in NERC OG1.
VFtemp: BBP_VFTEMP  # Not present in NERC OG1. Possible OG1 name: TCPUCHLA.
cdom: CDOM
fdom365: FDOM
chlorophyll: CHLA
chla470: CHLA
dissolved_oxygen: DOXY
oxygen_concentration: DOXY
downwelling_PAR: DPAR
down_irradiance_380: ED380
down_irradiance_490: ED490
chlorophyll_raw: FLUOCHLA
fluorCount: FLUOCHLA
cdom_raw: FLUOCDOM
phycoerythrin_raw: FLUOPHYC
O2Freq: FREQDOXY
O2_sat: OXYSAT
O2_saturation: OXYSAT
dissolved_oxygen_sat: OXYSAT
phycoerythrin: PHYC
backscatter_raw: RBBP700
temperature_oxygen: TEMPDOXY
turbidity: TURB

#### ENGINEERING PARAMETERS (Original -> Requested OG1 Name) ####
ad2cp_heading: AD2CP_HEADING  # Not present in NERC OG1. Possible OG1 name: HEADING.
ad2cp_pitch: AD2CP_PITCH  # Not present in NERC OG1. Possible OG1 name: PITCH.
ad2cp_pressure: AD2CP_PRES  # Not present in NERC OG1. Possible OG1 name: PRES2.
ad2cp_roll: AD2CP_ROLL  # Not present in NERC OG1. Possible OG1 name: ROLL.
ad2cp_time: AD2CP_TIME  # Not present in NERC OG1.
delta_time_s: DELTA_TIME_S  # Not present in NERC OG1.
east_displacement: EAST_DISPLACEMENT  # Not present in NERC OG1.
